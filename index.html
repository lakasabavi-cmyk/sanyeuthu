<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a2e">
<title>🔮 Yêu Thú Săn Bắt</title>
<link rel="stylesheet" href="css/style.css">

<!-- ============================================================
     📋 VERSION HISTORY
     v1.00 — Khởi tạo
     v1.01 — Fullscreen + safe area
     v1.02 — 🔍 search, bỏ manual turn
     v1.03 — 🐾 Collection
     v1.04 — FIX ** → Math.pow
     v1.05 — Bỏ fullscreen button
     v1.06 — Balls trên nút Bắt. Bỏ tên+% balls. Bỏ thanh tỷ lệ.
             Túi x1 mỗi loại + daily +1. Tăng size nút Bắt.
     ★★★ CSS RULE: KHÔNG tự ý đổi vị trí/kích thước icon, button ★★★
     ============================================================ -->
</head>
<body>
<div id="toast" class="toast"></div>

<!-- ==================== LOGIN ==================== -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <h1>🔮 Yêu Thú Săn Bắt</h1>
    <div class="subtitle">Thu phục yêu thú ngũ hành</div>
    <div id="login-form">
      <div class="input-group"><label>Email</label><input type="email" id="input-email" placeholder="email@example.com"></div>
      <div class="input-group"><label>Mật khẩu</label><input type="password" id="input-password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="handleLogin()">Đăng nhập</button>
      <div class="divider">hoặc</div>
      <button class="btn btn-google" onclick="handleGoogleLogin()">🔵 Google</button>
      <div class="toggle-text">Chưa có tài khoản? <a onclick="toggleRegister()">Đăng ký</a></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="input-group"><label>Tên</label><input type="text" id="reg-name"></div>
      <div class="input-group"><label>Email</label><input type="email" id="reg-email"></div>
      <div class="input-group"><label>Mật khẩu</label><input type="password" id="reg-password"></div>
      <button class="btn btn-primary" onclick="handleRegister()">Tạo tài khoản</button>
      <div class="toggle-text">Đã có tài khoản? <a onclick="toggleRegister()">Đăng nhập</a></div>
    </div>
    <div class="login-version">v1.06</div>
  </div>
</div>

<!-- ==================== AR ==================== -->
<div id="screen-ar" class="screen">
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <div class="crosshair">
    <div class="crosshair-ring" id="crosshair-ring">
      <div class="crosshair-h"></div><div class="crosshair-v"></div><div class="crosshair-dot"></div>
    </div>
    <div class="crosshair-pulse" id="crosshair-pulse"></div>
  </div>

  <div class="hud-top">
    <div class="hud-info">
      <div class="hud-level" id="hud-level">Level 1</div>
      <div class="hud-realm" id="hud-realm">🌀 Luyện Khí</div>
      <div class="hud-xp-bar"><div class="hud-xp-fill" id="hud-xp-fill" style="width:0%"></div></div>
      <div class="hud-compass" id="compass-status">🧭 Chưa bật</div>
    </div>
    <div class="hud-tr">
      <button class="btn-compass" id="btn-compass" onclick="activateCompass()">🧭 La bàn</button>
      <button class="ar-exit" onclick="showScreen('screen-login')">✕</button>
    </div>
  </div>

  <div class="notif-found" id="notif-found">
    <div class="notif-found-icon" id="notif-found-icon">🐾</div>
    <div class="notif-found-info">
      <div class="notif-found-name" id="notif-found-name"></div>
      <div class="notif-found-detail" id="notif-found-detail"></div>
    </div>
    <button class="notif-found-x" onclick="closeNotifFound()">✕</button>
  </div>

  <div class="ar-distance" id="ar-distance" style="display:none">
    <div class="ar-dist-val" id="ar-dist-val">~0m</div>
    <div class="ar-dist-hint" id="ar-dist-hint">Xoay camera</div>
  </div>

  <div class="side-nav">
    <button class="sn-btn" onclick="showScreen('screen-profile')" title="Hồ sơ"><span>👤</span></button>
    <button class="sn-btn" onclick="showScreen('screen-collection')" title="Yêu thú"><span>🐾</span></button>
    <button class="sn-btn sn-search" id="btn-search" onclick="startSearch()" title="Tìm"><span>🔍</span></button>
  </div>

  <!-- ★ BOTTOM: balls trên nút Bắt, không có thanh tỷ lệ ★ -->
  <div class="ar-bottom">
    <div class="ar-balls" id="ar-balls-row"></div>
    <button class="ar-capture disabled" id="capture-btn" onclick="doCapture()">🎯</button>
  </div>
</div>

<!-- RESULT -->
<div class="result-modal" id="result-modal">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-sub" id="result-sub"></div>
  <button class="result-btn" id="result-btn" onclick="closeResult()">Tiếp tục</button>
</div>

<!-- PROFILE -->
<div id="screen-profile" class="screen">
  <button class="btn-back" onclick="showScreen('screen-ar')">←</button>
  <div class="profile-header">
    <div class="profile-avatar">🧙</div>
    <div class="profile-realm" id="profile-realm"></div>
    <div class="profile-level" id="profile-level"></div>
  </div>
  <div class="profile-stats">
    <div class="stat-card"><div class="stat-value" id="stat-caught" style="color:#4caf50">0</div><div class="stat-label">Bắt được</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-failed" style="color:#f44336">0</div><div class="stat-label">Trượt</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-rate" style="color:#4fc3f7">0%</div><div class="stat-label">Tỷ lệ</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-total-xp" style="color:#ffd700">0</div><div class="stat-label">Tổng XP</div></div>
  </div>
</div>

<!-- COLLECTION -->
<div id="screen-collection" class="screen">
  <button class="btn-back" onclick="showScreen('screen-ar')">←</button>
  <div class="coll-header">
    <div class="coll-title">🐾 Yêu Thú</div>
    <div class="coll-count" id="coll-count">0 con</div>
    <div class="coll-filter">
      <button class="coll-fb active" onclick="filterCollection('all',this)">Tất cả</button>
      <button class="coll-fb" onclick="filterCollection('KIM',this)">⚔️</button>
      <button class="coll-fb" onclick="filterCollection('MOC',this)">🌿</button>
      <button class="coll-fb" onclick="filterCollection('THUY',this)">💧</button>
      <button class="coll-fb" onclick="filterCollection('HOA',this)">🔥</button>
      <button class="coll-fb" onclick="filterCollection('THO',this)">🏔️</button>
    </div>
  </div>
  <div class="coll-grid" id="coll-grid"></div>
</div>

<script src="js/versions.js"></script>
<script src="js/config.js"></script>
<script src="js/creatures.js"></script>
<script src="js/idle.js"></script>
<script src="js/balls.js"></script>
<script src="js/navigation.js"></script>
<script src="js/camera.js"></script>
<script src="js/capture.js"></script>
<script src="js/creature-art.js"></script>
<script src="js/config.js"></script>     
<script src="js/ui.js"></script>
</body>
</html>
