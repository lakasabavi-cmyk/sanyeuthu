<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔮 Yêu Thú Săn Bắt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a2e;color:#fff;overflow:hidden;height:100vh;width:100vw}
.screen{display:none;position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto}
.screen.active{display:flex;flex-direction:column}

/* LOGIN */
#screen-login{justify-content:center;align-items:center;background:linear-gradient(135deg,#0a0a2e,#1a0a3e,#0a2a4e);padding:20px}
.login-\boxed{width:100%;max-width:350px;background:rgba(255,255,255,.08);border-radius:20px;padding:30px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
.login-box h1{text-align:center;font-size:28px;margin-bottom:5px}
.login-box .subtitle{text-align:center;color:#aaa;margin-bottom:25px;font-size:14px}
.input-group{margin-bottom:15px}.input-group label{display:block;margin-bottom:5px;font-size:13px;color:#ccc}
.input-group input{width:100%;padding:12px 15px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:16px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,#7c4dff,#448aff);color:#fff}
.btn-primary:active{transform:scale(.97)}
.btn-google{background:#fff;color:#333;display:flex;align-items:center;justify-content:center;gap:10px}
.divider{text-align:center;margin:20px 0;color:#888;font-size:13px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:rgba(255,255,255,.15)}
.divider::before{left:0}.divider::after{right:0}
.toggle-text{text-align:center;margin-top:15px;font-size:13px;color:#aaa}
.toggle-text a{color:#7c4dff;cursor:pointer;text-decoration:none}

/* AR SCREEN */
#screen-ar{background:#000;position:relative}
#camera-feed{width:100%;height:100%;object-fit:cover;position:absolute}
#ar-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* ★ CROSSHAIR — DẤU + TÂM NGẮM ★ */
.crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none}
.crosshair-ring{width:90px;height:90px;border:2.5px solid rgba(255,255,255,.45);border-radius:50%;position:relative;transition:border-color .3s,box-shadow .3s}
.crosshair-ring.locked{border-color:#4caf50;box-shadow:0 0 30px rgba(76,175,80,.5)}
.crosshair-ring.close{border-color:#ffc107}
.crosshair-h{position:absolute;top:50%;left:-20px;right:-20px;height:1.5px;background:rgba(255,255,255,.5)}
.crosshair-v{position:absolute;left:50%;top:-20px;bottom:-20px;width:1.5px;background:rgba(255,255,255,.5)}
.crosshair-dot{position:absolute;top:50%;left:50%;width:6px;height:6px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.crosshair-pulse{position:absolute;top:50%;left:50%;width:120px;height:120px;border:2px solid rgba(76,175,80,.35);border-radius:50%;transform:translate(-50%,-50%);animation:crossPulse 1.5s infinite;display:none}
@keyframes crossPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.35);opacity:0}}

/* Top HUD */
.hud-top{position:absolute;top:0;left:0;right:0;padding:15px;display:flex;justify-content:space-between;align-items:flex-start;z-index:20}
.hud-info{background:rgba(0,0,0,.65);border-radius:12px;padding:10px 15px;backdrop-filter:blur(10px)}
.hud-level{font-size:12px;color:#aaa}.hud-realm{font-size:18px;font-weight:700;color:#ffd700}
.hud-xp-bar{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:5px;overflow:hidden}
.hud-xp-fill{height:100%;background:linear-gradient(90deg,#7c4dff,#448aff);border-radius:3px;transition:width .5s}
.hud-compass{background:rgba(0,0,0,.6);border-radius:50%;width:55px;height:55px;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(10px);transition:transform .3s}

/* Distance */
.ar-distance{position:absolute;bottom:195px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(0,0,0,.7);border-radius:12px;padding:8px 20px;text-align:center;backdrop-filter:blur(10px)}
.ar-dist-val{font-size:18px;font-weight:700;color:#4fc3f7}
.ar-dist-hint{font-size:11px;color:#aaa;margin-top:2px}

/* Balls */
.ar-balls-row{position:absolute;bottom:120px;left:10px;right:10px;z-index:15;display:flex;gap:6px;justify-content:center;overflow-x:auto;padding:5px}
.ar-ball{width:56px;height:72px;border-radius:12px;border:2.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:10px;font-weight:600;position:relative;flex-shrink:0}
.ar-ball.selected{border-color:#fff;transform:scale(1.1);box-shadow:0 0 15px rgba(255,255,255,.4)}
.ar-ball.advantage{border-color:rgba(76,175,80,.6)}
.ar-ball.disadvantage{border-color:rgba(244,67,54,.4);opacity:.6}
.ar-ball-icon{font-size:20px}.ar-ball-name{font-size:9px;margin-top:1px}
.ar-ball-rate{font-size:10px;font-weight:700}.ar-ball-count{font-size:8px;opacity:.7}
.ar-ball-rel{font-size:7px;position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:1px 5px;border-radius:6px;font-weight:700;white-space:nowrap}
.ar-ball-rel.khac{background:rgba(76,175,80,.8);color:#fff}
.ar-ball-rel.sinh{background:rgba(244,67,54,.8);color:#fff}

/* Rate + Capture */
.ar-bottom{position:absolute;bottom:15px;left:0;right:0;z-index:15;display:flex;flex-direction:column;align-items:center;gap:8px}
.ar-rate-row{display:flex;align-items:center;gap:10px;width:85%}
.ar-rate-label{font-size:12px;color:#aaa;white-space:nowrap}
.ar-rate-track{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.ar-rate-fill{height:100%;border-radius:4px;transition:width .2s,background .3s}
.ar-rate-pct{font-size:16px;font-weight:700;min-width:50px;text-align:right}
.ar-capture-btn{width:75px;height:75px;border-radius:50%;border:4px solid rgba(255,255,255,.8);background:rgba(255,107,107,.8);color:#fff;font-size:26px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,107,107,.4)}
.ar-capture-btn:active{transform:scale(.85)}
.ar-capture-btn.disabled{opacity:.15;cursor:not-allowed;box-shadow:none}

/* Result modal */
.result-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:400;display:none;justify-content:center;align-items:center;flex-direction:column;padding:30px}
.result-modal.active{display:flex}
.result-icon{font-size:80px;margin-bottom:20px}
.result-title{font-size:22px;font-weight:700;text-align:center;line-height:1.5}
.result-sub{font-size:14px;color:#aaa;margin-top:10px;text-align:center;line-height:1.6}
.result-btn{padding:14px 40px;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;margin-top:25px;color:#fff}
.result-btn.ok{background:linear-gradient(135deg,#7c4dff,#448aff)}
.result-btn.fail{background:linear-gradient(135deg,#f44336,#e57373)}

/* Notification */
.notification{position:absolute;top:85px;left:15px;right:15px;background:linear-gradient(135deg,rgba(124,77,255,.9),rgba(68,138,255,.9));border-radius:15px;padding:15px 20px;z-index:25;transform:translateY(-130%);transition:transform .5s cubic-bezier(.175,.885,.32,1.275)}
.notification.show{transform:translateY(0)}
.notification-title{font-size:14px;font-weight:600;margin-bottom:5px}
.notification-desc{font-size:12px;opacity:.9}
.notification-btn{margin-top:10px;padding:8px 20px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;font-size:13px;cursor:pointer}

/* Bottom nav buttons */
.hud-nav{position:absolute;bottom:200px;left:15px;z-index:15;display:flex;flex-direction:column;gap:8px}
.hud-nav-btn{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px)}
.hud-nav-btn:active{transform:scale(.9)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,0,0,.85);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:1000;transition:transform .4s;backdrop-filter:blur(10px)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Profile & Inventory */
#screen-profile,#screen-inventory{background:linear-gradient(135deg,#0a0a2e,#1a0a3e);padding:20px}
.profile-header{text-align:center;padding:20px 0}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#7c4dff,#448aff);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 15px}
.profile-realm{font-size:22px;font-weight:700;color:#ffd700}
.profile-level{font-size:14px;color:#aaa;margin-top:5px}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.stat-card{background:rgba(255,255,255,.08);border-radius:15px;padding:15px;text-align:center}
.stat-value{font-size:28px;font-weight:700}.stat-label{font-size:12px;color:#aaa;margin-top:5px}
.inv-title{text-align:center;font-size:22px;padding:20px 0}
.ball-inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.inv-item{background:rgba(255,255,255,.08);border-radius:15px;padding:15px;text-align:center}
.inv-ball-icon{width:50px;height:50px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px}
.inv-ball-name{font-size:13px;font-weight:600}.inv-ball-count{font-size:18px;font-weight:700;margin-top:5px}
.btn-back{position:absolute;top:15px;left:15px;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;z-index:50}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- ===== LOGIN ===== -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <h1>🔮 Yêu Thú Săn Bắt</h1>
    <div class="subtitle">Thu phục yêu thú ngũ hành — Tu tiên thành tiên</div>
    <div id="login-form">
      <div class="input-group"><label>Email</label><input type="email" id="input-email" placeholder="email@example.com"></div>
      <div class="input-group"><label>Mật khẩu</label><input type="password" id="input-password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="handleLogin()">Đăng nhập</button>
      <div class="divider">hoặc</div>
      <button class="btn btn-google" onclick="handleGoogleLogin()">🔵 Đăng nhập với Google</button>
      <div class="toggle-text">Chưa có tài khoản? <a onclick="toggleRegister()">Đăng ký</a></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="input-group"><label>Tên</label><input type="text" id="reg-name"></div>
      <div class="input-group"><label>Email</label><input type="email" id="reg-email"></div>
      <div class="input-group"><label>Mật khẩu</label><input type="password" id="reg-password"></div>
      <button class="btn btn-primary" onclick="handleRegister()">Tạo tài khoản</button>
      <div class="toggle-text">Đã có tài khoản? <a onclick="toggleRegister()">Đăng nhập</a></div>
    </div>
  </div>
</div>

<!-- ===== AR SCREEN — MỌI THỨ TRÊN ĐÂY ===== -->
<div id="screen-ar" class="screen">
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <!-- ★ DẤU + TÂM NGẮM — LUÔN HIỂN THỊ ★ -->
  <div class="crosshair" id="crosshair">
    <div class="crosshair-ring" id="crosshair-ring">
      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>
      <div class="crosshair-dot"></div>
    </div>
    <div class="crosshair-pulse" id="crosshair-pulse"></div>
  </div>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="hud-info">
      <div class="hud-level" id="hud-level">Level 1</div>
      <div class="hud-realm" id="hud-realm">🌀 Luyện Khí</div>
      <div class="hud-xp-bar"><div class="hud-xp-fill" id="hud-xp-fill" style="width:0%"></div></div>
    </div>
    <div class="hud-compass" id="hud-compass">🧭</div>
  </div>

  <!-- Notification -->
  <div id="notification" class="notification">
    <div class="notification-title" id="notif-title"></div>
    <div class="notification-desc" id="notif-desc"></div>
    <button class="notification-btn" onclick="acceptHunt()">⚔️ Truy tìm ngay</button>
  </div>

  <!-- Distance -->
  <div class="ar-distance" id="ar-distance" style="display:none">
    <div class="ar-dist-val" id="ar-dist-val">~0m</div>
    <div class="ar-dist-hint" id="ar-dist-hint">Xoay camera theo mũi tên</div>
  </div>

  <!-- Side nav buttons -->
  <div class="hud-nav">
    <div class="hud-nav-btn" onclick="showScreen('screen-profile')">👤</div>
    <div class="hud-nav-btn" onclick="showScreen('screen-inventory')">🎒</div>
    <div class="hud-nav-btn" onclick="triggerDetection()">🔍</div>
    <div class="hud-nav-btn" onclick="showScreen('screen-login')">🚪</div>
  </div>

  <!-- ★ BALLS + RATE + CAPTURE — SÁT NHAU ★ -->
  <div class="ar-balls-row" id="ar-balls-row"></div>
  <div class="ar-bottom">
    <div class="ar-rate-row">
      <div class="ar-rate-label">Tỷ lệ</div>
      <div class="ar-rate-track"><div class="ar-rate-fill" id="ar-rate-fill" style="width:0%;background:#f44336"></div></div>
      <div class="ar-rate-pct" id="ar-rate-pct">0%</div>
    </div>
    <button class="ar-capture-btn disabled" id="capture-btn" onclick="doCapture()">🎯</button>
  </div>
</div>

<!-- ===== RESULT MODAL ===== -->
<div class="result-modal" id="result-modal">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-sub" id="result-sub"></div>
  <button class="result-btn ok" id="result-btn" onclick="closeResult()">Tiếp tục</button>
</div>

<!-- ===== PROFILE ===== -->
<div id="screen-profile" class="screen">
  <button class="btn-back" onclick="showScreen('screen-ar')">←</button>
  <div class="profile-header"><div class="profile-avatar">🧙</div><div class="profile-realm" id="profile-realm"></div><div class="profile-level" id="profile-level"></div></div>
  <div class="profile-stats">
    <div class="stat-card"><div class="stat-value" id="stat-caught" style="color:#4caf50">0</div><div class="stat-label">Bắt được</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-failed" style="color:#f44336">0</div><div class="stat-label">Trượt</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-rate" style="color:#4fc3f7">0%</div><div class="stat-label">Tỷ lệ</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-total-xp" style="color:#ffd700">0</div><div class="stat-label">Tổng XP</div></div>
  </div>
</div>

<!-- ===== INVENTORY ===== -->
<div id="screen-inventory" class="screen">
  <button class="btn-back" onclick="showScreen('screen-ar')">←</button>
  <div class="inv-title">🎒 Túi Bảo Bối</div>
  <div class="ball-inventory" id="ball-inventory"></div>
</div>

<script>
// ==================== CONFIG ====================
var CONFIG={
  SPAWN_MIN:2, SPAWN_MAX:5,
  CAPTURE_RANGE:5,
  CROSSHAIR_LOCK_PX:50,
  FOV:60,
  XP_CAPTURE:100, XP_FAIL:-30,
  ESCAPE_MIN:1, ESCAPE_MAX:3
};

// ==================== NGŨ HÀNH ====================
var ELEMENTS={
  KIM:{name:'Kim',icon:'⚔️',color:'#FFD700',bg:'linear-gradient(135deg,#B8860B,#FFD700)',primary:'#FFD700',glow:'#FFF8DC'},
  MOC:{name:'Mộc',icon:'🌿',color:'#228B22',bg:'linear-gradient(135deg,#006400,#228B22)',primary:'#228B22',glow:'#90EE90'},
  THUY:{name:'Thủy',icon:'💧',color:'#1E90FF',bg:'linear-gradient(135deg,#0052CC,#1E90FF)',primary:'#1E90FF',glow:'#87CEEB'},
  HOA:{name:'Hỏa',icon:'🔥',color:'#FF4500',bg:'linear-gradient(135deg,#CC2200,#FF4500)',primary:'#FF4500',glow:'#FFA07A'},
  THO:{name:'Thổ',icon:'🏔️',color:'#8B4513',bg:'linear-gradient(135deg,#5C2E00,#8B4513)',primary:'#8B4513',glow:'#DEB887'}
};
var SINH={KIM:'THUY',THUY:'MOC',MOC:'HOA',HOA:'THO',THO:'KIM'};
var KHAC={KIM:'MOC',MOC:'THO',THO:'THUY',THUY:'HOA',HOA:'KIM'};

// ==================== TU TIÊN ====================
var REALMS=[{name:'Luyện Khí',min:1,icon:'🌀'},{name:'Trúc Cơ',min:11,icon:'🏗️'},{name:'Kết Đan',min:21,icon:'💎'},{name:'Nguyên Anh',min:31,icon:'👶'},{name:'Hóa Thần',min:41,icon:'⚡'},{name:'Luyện Hư',min:51,icon:'🌌'},{name:'Hợp Thể',min:61,icon:'☯️'},{name:'Đại Thừa',min:71,icon:'🏔️'},{name:'Độ Kiếp',min:81,icon:'🌩️'},{name:'Tiên Nhân',min:91,icon:'✨'}];
function getRealm(l){for(var i=REALMS.length-1;i>=0;i--)if(l>=REALMS[i].min)return REALMS[i];return REALMS[0];}
function xpForLevel(l){return Math.floor(100*Math.pow(1.15,l-1));}

// ==================== YÊU THÚ DB ====================
var CREATURE_DB=[
  {id:1,name:'Kim Ưng',element:'KIM',emoji:'🦅',rarity:'common',minLvl:1,maxLvl:10},
  {id:2,name:'Bạch Hổ',element:'KIM',emoji:'🐅',rarity:'rare',minLvl:15,maxLvl:35},
  {id:3,name:'Kim Long',element:'KIM',emoji:'🐲',rarity:'legendary',minLvl:40,maxLvl:80},
  {id:4,name:'Mộc Xà',element:'MOC',emoji:'🐍',rarity:'common',minLvl:1,maxLvl:10},
  {id:5,name:'Thanh Lân',element:'MOC',emoji:'🦎',rarity:'rare',minLvl:15,maxLvl:35},
  {id:6,name:'Mộc Hoàng',element:'MOC',emoji:'🦚',rarity:'legendary',minLvl:40,maxLvl:80},
  {id:7,name:'Thủy Quy',element:'THUY',emoji:'🐢',rarity:'common',minLvl:1,maxLvl:10},
  {id:8,name:'Giao Long',element:'THUY',emoji:'🐉',rarity:'rare',minLvl:15,maxLvl:35},
  {id:9,name:'Huyền Vũ',element:'THUY',emoji:'🐋',rarity:'legendary',minLvl:40,maxLvl:80},
  {id:10,name:'Hỏa Ly',element:'HOA',emoji:'🦊',rarity:'common',minLvl:1,maxLvl:10},
  {id:11,name:'Xích Phượng',element:'HOA',emoji:'🦅',rarity:'rare',minLvl:15,maxLvl:35},
  {id:12,name:'Chu Tước',element:'HOA',emoji:'🐦‍🔥',rarity:'legendary',minLvl:40,maxLvl:80},
  {id:13,name:'Thổ Giáp',element:'THO',emoji:'🐗',rarity:'common',minLvl:1,maxLvl:10},
  {id:14,name:'Huyền Giáp',element:'THO',emoji:'🦎',rarity:'rare',minLvl:15,maxLvl:35},
  {id:15,name:'Kỳ Lân',element:'THO',emoji:'🦄',rarity:'legendary',minLvl:40,maxLvl:80}
];
var RARITY_COLORS={common:'#4caf50',rare:'#2196f3',legendary:'#ff9800'};
var RARITY_NAMES={common:'Thường',rare:'Hiếm',legendary:'Huyền thoại'};

// ==================== GAME STATE ====================
var GS={user:null,level:1,xp:0,totalXp:0,caught:0,failed:0,
  inventory:{KIM:20,MOC:20,THUY:20,HOA:20,THO:20},
  collection:[],currentTarget:null,selectedBall:'HOA'};

function loadState(){var s=localStorage.getItem('yeuthu_v2');if(s){try{var d=JSON.parse(s);for(var k in d)GS[k]=d[k];}catch(e){}}}
function saveState(){localStorage.setItem('yeuthu_v2',JSON.stringify(GS));}

// ==================== CAPTURE LOGIC ====================
function getLevelRate(cL,pL){var d=cL-pL;if(d<=-2)return 1;if(d===-1)return .8;if(d===0)return .5;if(d===1)return .3;if(d===2)return .1;if(d===3)return .01;if(d===4)return .004;if(d===5)return .001;return 0;}
function getElemMod(b,c){if(KHAC[b]===c)return 1.5;if(SINH[b]===c)return .5;return 1;}
function getRate(b,c,cL,pL,acc){return Math.min(1,getLevelRate(cL,pL)*getElemMod(b,c)*acc);}

// ==================== UI ====================
function showScreen(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  if(id==='screen-ar'){startCamera();updateHUD();}
  if(id==='screen-profile')updateProfile();
  if(id==='screen-inventory')updateInventory();
}
function showToast(m,d){d=d||3000;var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},d);}
function updateHUD(){var r=getRealm(GS.level);document.getElementById('hud-level').textContent='Level '+GS.level;document.getElementById('hud-realm').textContent=r.icon+' '+r.name;document.getElementById('hud-xp-fill').style.width=Math.min(100,(GS.xp/xpForLevel(GS.level))*100)+'%';}
function updateProfile(){var r=getRealm(GS.level);document.getElementById('profile-realm').textContent=r.icon+' '+r.name;document.getElementById('profile-level').textContent='Level '+GS.level+' — '+GS.xp+'/'+xpForLevel(GS.level)+' XP';document.getElementById('stat-caught').textContent=GS.caught;document.getElementById('stat-failed').textContent=GS.failed;var t=GS.caught+GS.failed;document.getElementById('stat-rate').textContent=(t>0?Math.round(GS.caught/t*100):0)+'%';document.getElementById('stat-total-xp').textContent=GS.totalXp;}
function updateInventory(){var c=document.getElementById('ball-inventory');c.innerHTML='';for(var k in GS.inventory){var el=ELEMENTS[k];c.innerHTML+='<div class="inv-item"><div class="inv-ball-icon" style="background:'+el.bg+'">'+el.icon+'</div><div class="inv-ball-name" style="color:'+el.color+'">'+el.name+'</div><div class="inv-ball-count">×'+GS.inventory[k]+'</div></div>';}}

// ==================== CAMERA ====================
var cameraStream=null;
function startCamera(){if(cameraStream)return;navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(s){cameraStream=s;document.getElementById('camera-feed').srcObject=s;var cv=document.getElementById('ar-canvas');var v=document.getElementById('camera-feed');v.onloadedmetadata=function(){cv.width=v.videoWidth;cv.height=v.videoHeight;};}).catch(function(e){showToast('Không mở camera!');});}

// ==================== GPS + COMPASS ====================
var currentHeading=0,playerLat=10.762622,playerLng=106.660172;
window.addEventListener('deviceorientationabsolute',function(e){if(e.alpha!==null){currentHeading=e.alpha;document.getElementById('hud-compass').style.transform='rotate('+(-currentHeading)+'deg)';}});
window.addEventListener('deviceorientation',function(e){if(e.webkitCompassHeading!==undefined)currentHeading=e.webkitCompassHeading;else if(e.alpha!==null)currentHeading=360-e.alpha;document.getElementById('hud-compass').style.transform='rotate('+(-currentHeading)+'deg)';});
if(navigator.geolocation){navigator.geolocation.watchPosition(function(p){playerLat=p.coords.latitude;playerLng=p.coords.longitude;},function(){},{enableHighAccuracy:true,maximumAge:3000});}
function getDist(a,b,c,d){var R=6371000,dLa=(c-a)*Math.PI/180,dLn=(d-b)*Math.PI/180;var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function getBearing(a,b,c,d){var dLn=(d-b)*Math.PI/180;var y=Math.sin(dLn)*Math.cos(c*Math.PI/180);var x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dLn);return((Math.atan2(y,x)*180/Math.PI)+360)%360;}

// ==================== SPAWN ====================
function placeCreature(c){
  var angle=Math.random()*360,dist=CONFIG.SPAWN_MIN+Math.random()*(CONFIG.SPAWN_MAX-CONFIG.SPAWN_MIN);
  var dLat=(dist*Math.cos(angle*Math.PI/180))/111320,dLng=(dist*Math.sin(angle*Math.PI/180))/(111320*Math.cos(playerLat*Math.PI/180));
  c.lat=playerLat+dLat;c.lng=playerLng+dLng;
}
function generateCreature(){
  var pL=gameState.level;
  var candidates=CREATURE_DB.filter(function(c){return c.minLvl<=pL+5&&c.maxLvl>=pL-2;});
  var base=candidates[Math.floor(Math.random()*candidates.length)]||CREATURE_DB[0];
  var cL=Math.max(base.minLvl,Math.min(base.maxLvl,pL+Math.floor(Math.random()*8)-3));
  var angle=Math.random()*360;
  var dist=2+Math.random()*3; // ★ 2-5m trong phòng ★
  var dLat=(dist*Math.cos(angle*Math.PI/180))/111320;
  var dLng=(dist*Math.sin(angle*Math.PI/180))/(111320*Math.cos(playerLat*Math.PI/180));
  return Object.assign({},base,{
    level:cL,lat:playerLat+dLat,lng:playerLng+dLng,
    spawnTime:Date.now(),
    escapeChances:CONFIG.ESCAPE_MIN+Math.floor(Math.random()*(CONFIG.ESCAPE_MAX-CONFIG.ESCAPE_MIN+1)),
    escapeAttemptsUsed:0
  });
}

function triggerDetection(){

  GS.currentTarget=creature;saveState();
  var realm=getRealm(creature.level);
  document.getElementById('notif-title').innerHTML='⚠️ Phát hiện <strong>'+creature.emoji+' '+creature.name+'</strong>';
  document.getElementById('notif-desc').innerHTML=ELEMENTS[creature.element].icon+' '+ELEMENTS[creature.element].name+' | Lv.'+creature.level+' ('+realm.icon+' '+realm.name+') | ~'+Math.round(getDist(playerLat,playerLng,creature.lat,creature.lng))+'m';
  document.getElementById('notification').classList.add('show');
  showToast('🔮 Đã phát hiện '+creature.emoji+' '+creature.name+'!');
}
function acceptHunt(){
  document.getElementById('notification').classList.remove('show');
  document.getElementById('ar-distance').style.display='';
  renderBalls();
  showToast('⚔️ Truy tìm! Xoay camera theo mũi tên!');
}

// ==================== RENDER BALLS ====================
function renderBalls(){
  var row=document.getElementById('ar-balls-row');row.innerHTML='';
  if(!GS.currentTarget)return;
  var cre=GS.currentTarget;
  for(var key in GS.inventory){
    var el=ELEMENTS[key],count=GS.inventory[key];
    var rate=getRate(key,cre.element,cre.level,GS.level,1);
    var ratePct=Math.round(rate*1000)/10;
    var relHtml='',ballCls='';
    if(KHAC[key]===cre.element){relHtml='<div class="ar-ball-rel khac">Khắc</div>';ballCls=' advantage';}
    else if(SINH[key]===cre.element){relHtml='<div class="ar-ball-rel sinh">Sinh</div>';ballCls=' disadvantage';}
    var rateColor=ratePct>=50?'#4caf50':ratePct>=20?'#ffc107':'#f44336';
    row.innerHTML+='<div class="ar-ball'+(GS.selectedBall===key?' selected':'')+ballCls+'" onclick="selectBall(this,\''+key+'\')" style="background:'+el.bg+';opacity:'+(count>0?1:.3)+'">'+relHtml+'<div class="ar-ball-icon">'+el.icon+'</div><div class="ar-ball-name">'+el.name+'</div><div class="ar-ball-rate" style="color:'+rateColor+'">'+ratePct+'%</div><div class="ar-ball-count">×'+count+'</div></div>';
  }
}
function selectBall(elem,key){
  GS.selectedBall=key;
  document.querySelectorAll('.ar-ball').forEach(function(b){b.classList.remove('selected');});
  elem.classList.add('selected');
}

// ==================== AR RENDER LOOP ====================
var creatureOnScreen=false,crosshairLocked=false,currentAccuracy=0;
function renderAR(){
  var canvas=document.getElementById('ar-canvas');
  if(!canvas.width){requestAnimationFrame(renderAR);return;}
  var ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  var target=GS.currentTarget;if(!target){requestAnimationFrame(renderAR);return;}
  var cx=canvas.width/2,cy=canvas.height/2;
  var time=Date.now()/1000;
  var gpsDist=getDist(playerLat,playerLng,target.lat,target.lng);
  var bearing=getBearing(playerLat,playerLng,target.lat,target.lng);
  var relAngle=((bearing-currentHeading)+360)%360;
  var aCenter=relAngle>180?360-relAngle:relAngle;
  var halfFOV=CONFIG.FOV/2;

  // Update distance UI
  document.getElementById('ar-dist-val').textContent='~'+Math.round(gpsDist)+'m';

  if(aCenter>halfFOV){
    // ★ MŨI TÊN DUY NHẤT — trên canvas, quay theo la bàn ★
    creatureOnScreen=false;crosshairLocked=false;currentAccuracy=0;
    var dirs=['Bắc','Đông Bắc','Đông','Đông Nam','Nam','Tây Nam','Tây','Tây Bắc'];
    var dirName=dirs[Math.round(bearing/45)%8];
    document.getElementById('ar-dist-hint').textContent='Xoay về hướng '+dirName;

    // Arrow
    var arrowSize=Math.min(canvas.width,canvas.height)*0.11;
    var pulse=0.7+Math.sin(time*3)*0.3;
    // Glow bg
    var bgGrad=ctx.createRadialGradient(cx,cy,10,cx,cy,250);
    bgGrad.addColorStop(0,'rgba(76,195,247,'+(0.2*pulse)+')');bgGrad.addColorStop(1,'transparent');
    ctx.fillStyle=bgGrad;ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(cx,cy-40);
    ctx.rotate(relAngle*Math.PI/180);
    var ag=ctx.createLinearGradient(0,-arrowSize,0,arrowSize*0.3);
    ag.addColorStop(0,'#4caf50');ag.addColorStop(1,'#81c784');
    ctx.fillStyle=ag;ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,-arrowSize);
    ctx.lineTo(arrowSize*0.5,-arrowSize*0.2);
    ctx.lineTo(arrowSize*0.22,-arrowSize*0.2);
    ctx.lineTo(arrowSize*0.22,arrowSize*0.3);
    ctx.lineTo(-arrowSize*0.22,arrowSize*0.3);
    ctx.lineTo(-arrowSize*0.22,-arrowSize*0.2);
    ctx.lineTo(-arrowSize*0.5,-arrowSize*0.2);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.shadowColor='rgba(76,195,247,0.8)';ctx.shadowBlur=15*pulse;
    ctx.fill();ctx.shadowBlur=0;
    ctx.restore();

    // Direction text below arrow
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(cx-100,cy+40,200,45);
    ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#4fc3f7';ctx.fillText('🧭 '+dirName,cx,cy+55);
    ctx.font='13px sans-serif';ctx.fillStyle='#fff';
    ctx.fillText('~'+Math.round(gpsDist)+'m',cx,cy+75);
    ctx.restore();

  }else{
    // ★ YÊU THÚ HIỂN THỊ TRÊN CAMERA — vị trí trên screen theo góc ★
    creatureOnScreen=true;
    var fovRatio=aCenter/halfFOV;
    var side=relAngle<180?1:-1;
    var creatureX=cx+side*fovRatio*(canvas.width*0.35);
    var creatureY=cy;

    // Size theo GPS distance (gần = to)
    var distFactor=Math.max(0.3,Math.min(1.5,CONFIG.SPAWN_MIN/Math.max(0.5,gpsDist)));
    var creatureSize=Math.min(canvas.width,canvas.height)*0.12*distFactor*2;

    // Vẽ yêu thú idle animation
    drawCreatureIdle(ctx,creatureX,creatureY,creatureSize,target,time);

    // ★ TÍNH CROSSHAIR LOCK — khoảng cách từ tâm (dấu +) đến yêu thú ★
    var dx=creatureX-cx,dy=creatureY-cy;
    var crossDist=Math.sqrt(dx*dx+dy*dy);
    crosshairLocked=crossDist<CONFIG.CROSSHAIR_LOCK_PX;

    if(crosshairLocked){
      currentAccuracy=Math.max(0.5,1-crossDist/CONFIG.CROSSHAIR_LOCK_PX*0.5);
    }else{
      currentAccuracy=Math.max(0,1-crossDist/(CONFIG.CROSSHAIR_LOCK_PX*3));
    }

    // Link line crosshair→creature khi gần
    if(crossDist<CONFIG.CROSSHAIR_LOCK_PX*3){
      ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(creatureX,creatureY);ctx.stroke();ctx.setLineDash([]);
    }

    // Distance text
    document.getElementById('ar-dist-hint').textContent=crosshairLocked?'✅ ĐÃ NHẮM ĐÚNG! Nhấn Bắt!':'🎯 Đưa dấu + vào yêu thú';
  }

  // ★ CẬP NHẬT CROSSHAIR ★
  var ring=document.getElementById('crosshair-ring');
  if(crosshairLocked){ring.classList.add('locked');ring.classList.remove('close');document.getElementById('crosshair-pulse').style.display='';}
  else{ring.classList.remove('locked');document.getElementById('crosshair-pulse').style.display='none';if(creatureOnScreen&&currentAccuracy>0.3)ring.classList.add('close');else ring.classList.remove('close');}

  // ★ CẬP NHẬT RATE ★
  var ball=GS.selectedBall;
  var rate=creatureOnScreen?getRate(ball,target.element,target.level,GS.level,currentAccuracy):0;
  var pct=Math.round(rate*1000)/10;
  document.getElementById('ar-rate-pct').textContent=pct+'%';
  var fill=document.getElementById('ar-rate-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct<=0?'#f44336':pct<=30?'#ff9800':pct<=70?'#ffc107':'#4caf50';

  // ★ NÚT BẮT ★
  var btn=document.getElementById('capture-btn');
  if(creatureOnScreen&&crosshairLocked)btn.classList.remove('disabled');
  else btn.classList.add('disabled');

  requestAnimationFrame(renderAR);
}

// ================================================================
// ★★★ CREATURE IDLE ANIMATION — sinh vật sống thực thụ ★★★
// ================================================================
function drawCreatureIdle(ctx,cx,cy,size,creature,time){
  var el=ELEMENTS[creature.element];
  var s=size/100;

  // Animations
  var bodySway=Math.sin(time*0.78)*4*s;
  var breathScale=1+Math.sin(time*1.25)*0.02;
  var headTurn=Math.sin(time*0.52)*12;
  var headBob=Math.sin(time*1.6)*3*s;
  var blinkT=(time%4);
  var isBlinking=blinkT>3.85&&blinkT<4.0;
  var tailWag=Math.sin(time*2.1)*30;
  var footTapT=(time%3);
  var footTapY=footTapT<0.3?-15*Math.sin(footTapT/0.3*Math.PI)*s:0;
  var earTwitchT=(time%5);
  var earTwitch=earTwitchT>4.7?-8*Math.sin((earTwitchT-4.7)/0.3*Math.PI):0;
  var hipSway=Math.sin(time*0.9+1)*2*s;

  // Glow
  var glowGrad=ctx.createRadialGradient(cx,cy,size*0.2,cx,cy,size*1.2);
  glowGrad.addColorStop(0,el.primary+'35');glowGrad.addColorStop(1,'transparent');
  ctx.fillStyle=glowGrad;ctx.fillRect(cx-size*1.5,cy-size*1.5,size*3,size*3);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(cx+bodySway*0.5,cy+size*0.52,size*0.38,size*0.08,0,0,Math.PI*2);ctx.fill();

  // Tail
  ctx.save();
  ctx.translate(cx+bodySway*0.3,cy+hipSway*0.5);
  ctx.rotate(tailWag*Math.PI/180*0.5);
  ctx.strokeStyle=el.primary;ctx.lineWidth=5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-18*s,10*s);ctx.quadraticCurveTo(-42*s,-5*s+Math.sin(time*2)*5*s,-52*s,-25*s);ctx.stroke();
  ctx.fillStyle=el.primary+'70';ctx.beginPath();ctx.arc(-52*s,-25*s,10*s,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Left foot
  ctx.save();ctx.translate(cx+bodySway*0.5-15*s,cy+size*0.38);
  ctx.fillStyle='#FFE0BD';ctx.strokeStyle=el.primary+'40';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,10*s,8*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();

  // Right foot (taps)
  ctx.save();ctx.translate(cx+bodySway*0.5+hipSway*0.3+15*s,cy+size*0.38+footTapY);
  ctx.fillStyle='#FFE0BD';ctx.strokeStyle=el.primary+'40';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,10*s,8*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();

  // Body
  ctx.save();ctx.translate(cx+bodySway,cy+hipSway*0.3);ctx.scale(breathScale,breathScale);
  ctx.fillStyle='#FFE0BD';ctx.strokeStyle=el.primary+'60';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.ellipse(0,5*s,26*s,24*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.ellipse(0,12*s,16*s,14*s,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Head
  ctx.save();ctx.translate(cx+bodySway,cy-18*s+headBob);ctx.rotate(headTurn*Math.PI/180);

  // Ears (twitch)
  [[-1,earTwitch],[1,-earTwitch]].forEach(function(pair){
    var sx=pair[0],tw=pair[1];
    ctx.save();ctx.translate(sx*18*s,-28*s);ctx.rotate(tw*Math.PI/180);
    ctx.fillStyle='#FFE0BD';ctx.strokeStyle=el.primary+'60';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,10*s);ctx.lineTo(sx*10*s,-18*s);ctx.lineTo(-sx*12*s,5*s);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#FFB6C1';
    ctx.beginPath();ctx.moveTo(-sx*2*s,6*s);ctx.lineTo(sx*6*s,-12*s);ctx.lineTo(-sx*10*s,3*s);ctx.closePath();ctx.fill();
    ctx.restore();
  });

  // Face
  var hr=28*s;
  ctx.fillStyle='#FFE0BD';ctx.strokeStyle=el.primary+'50';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,hr,hr*1.05,0,0,Math.PI*2);ctx.fill();ctx.stroke();

  // Blush
  ctx.fillStyle='#FFB6C150';
  ctx.beginPath();ctx.ellipse(-hr*0.55,5*s,7*s,5*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(hr*0.55,5*s,7*s,5*s,0,0,Math.PI*2);ctx.fill();

  // Eyes (blink)
  [-1,1].forEach(function(sx){
    if(isBlinking){
      ctx.strokeStyle='#333';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(sx*10*s-5*s,-2*s);ctx.lineTo(sx*10*s+5*s,-2*s);ctx.stroke();
    }else{
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(sx*10*s,-2*s,9*s,11*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=el.primary;ctx.beginPath();ctx.arc(sx*10*s,0,6*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(sx*10*s,0,3*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx*10*s-2.5*s,-3*s,2.5*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx*10*s+1.5*s,2*s,1.2*s,0,Math.PI*2);ctx.fill();
    }
  });

  // Mouth + nose
  ctx.strokeStyle='#333';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(0,10*s,7*s,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
  ctx.fillStyle=el.primary+'80';ctx.beginPath();ctx.ellipse(0,4*s,3*s,2.5*s,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Sparkles
  for(var sp=0;sp<6;sp++){
    var spAngle=time*1.5+sp*(Math.PI*2/6);
    var spDist=size*0.65+Math.sin(time*2+sp)*size*0.15;
    ctx.fillStyle=el.glow+'60';
    ctx.beginPath();ctx.arc(cx+Math.cos(spAngle)*spDist,cy+Math.sin(spAngle)*spDist*0.7,Math.max(1,1.5+Math.sin(time*3+sp*1.5)*1.5),0,Math.PI*2);ctx.fill();
  }
}

// ==================== CAPTURE ====================
function doCapture(){
  var creature=GS.currentTarget;if(!creature)return;
  if(!creatureOnScreen||!crosshairLocked){showToast('Đưa dấu + vào yêu thú!');return;}
  var ball=GS.selectedBall;
  if(GS.inventory[ball]<=0){showToast('Hết bảo bối hệ này!');return;}
  GS.inventory[ball]--;

  var rate=getRate(ball,creature.element,creature.level,GS.level,currentAccuracy);
  var success=Math.random()<rate;

  if(success){
    GS.caught++;GS.xp+=CONFIG.XP_CAPTURE;GS.totalXp+=CONFIG.XP_CAPTURE;
    GS.collection.push(Object.assign({},creature,{caughtAt:Date.now(),caughtWith:ball}));
    checkLevelUp();
    showResult('🎉','Bắt được '+creature.emoji+' <strong>'+creature.name+'</strong>!','+'+CONFIG.XP_CAPTURE+' XP | '+ELEMENTS[creature.element].icon+' '+ELEMENTS[creature.element].name+' Lv.'+creature.level,'ok');
  }else{
    GS.failed++;GS.xp+=CONFIG.XP_FAIL;if(GS.xp<0)GS.xp=0;
    var remain=(creature.escapeChances||1)-(creature.escapeAttemptsUsed||0)-1;
    if(remain<=0){
      showResult('💨',creature.emoji+' <strong>'+creature.name+'</strong> biến mất!','Hết lượt thoát. Tỷ lệ: '+Math.round(rate*100)+'%','fail');
    }else{
      // ★ CHẠY TRỐN — chạy sang vị trí mới trong phòng ★
      creature.escapeAttemptsUsed=(creature.escapeAttemptsUsed||0)+1;
      placeCreature(creature);
      creatureOnScreen=false;crosshairLocked=false;currentAccuracy=0;
      showResult('🏃',creature.emoji+' <strong>'+creature.name+'</strong> chạy trốn!','Còn '+remain+' lượt | Tỷ lệ: '+Math.round(rate*100)+'%<br>Yêu thú chạy sang vị trí mới! Theo mũi tên tìm lại!','fail');
    }
  }
  saveState();updateHUD();renderBalls();
}

function showResult(icon,title,sub,cls){
  document.getElementById('result-icon').innerHTML=icon;
  document.getElementById('result-title').innerHTML=title;
  document.getElementById('result-sub').innerHTML=sub;
  document.getElementById('result-btn').className='result-btn '+(cls==='ok'?'ok':'fail');
  document.getElementById('result-modal').classList.add('active');
}
function closeResult(){
  document.getElementById('result-modal').classList.remove('active');
  var c=GS.currentTarget;
  if(c&&c.escapeAttemptsUsed>=(c.escapeChances||1)){GS.currentTarget=null;}
  // Nếu còn chạy trốn → tiếp tục tìm (mũi tên tự hiển thị)
  // Nếu bắt được/biến mất → auto detect mới
  if(!GS.currentTarget){
    document.getElementById('ar-distance').style.display='none';
    setTimeout(function(){if(document.getElementById('screen-ar').classList.contains('active'))triggerDetection();},2000);
  }
}

function checkLevelUp(){var need=xpForLevel(GS.level);if(GS.xp>=need){GS.xp-=need;GS.level++;showToast('🎊 Level '+GS.level+'!',5000);checkLevelUp();}}

// ==================== INIT ====================
loadState();
renderAR();
setTimeout(function(){if(document.getElementById('screen-ar').classList.contains('active'))triggerDetection();},8000);
console.log('🔮 Yêu Thú Săn Bắt v2 — Crosshair + Idle + Single Arrow');
</script>
</body>
